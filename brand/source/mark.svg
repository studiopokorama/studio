<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" width="112" height="112">
  <!-- "poko" in a 2x2 grid. The violet p and second o are pieces in play: tilted 8deg, lifted. -->
  <defs>
    <filter id="lift" x="-50%" y="-50%" width="200%" height="220%"><feDropShadow dx="0" dy="6" stdDeviation="5.4" flood-color="#000" flood-opacity="0.55"/></filter>
  </defs>
  <rect width="112" height="112" rx="24" fill="#1B1A1F"/>
  <g transform="rotate(8 34 34)" filter="url(#lift)"><rect x="14" y="14" width="40" height="40" rx="10" fill="#9B7BF5"/></g>
  <g transform="rotate(8 34 34)"><text x="34" y="34" font-family="'Bricolage Grotesque', sans-serif" font-weight="800" font-size="25" fill="#121115" text-anchor="middle" dominant-baseline="central">p</text></g>
  <rect x="58" y="14" width="40" height="40" rx="10" fill="#2A2830"/>
  <text x="78" y="34" font-family="'Bricolage Grotesque', sans-serif" font-weight="800" font-size="25" fill="#EDEBE6" text-anchor="middle" dominant-baseline="central">o</text>
  <rect x="14" y="58" width="40" height="40" rx="10" fill="#2A2830"/>
  <text x="34" y="78" font-family="'Bricolage Grotesque', sans-serif" font-weight="800" font-size="25" fill="#EDEBE6" text-anchor="middle" dominant-baseline="central">k</text>
  <g transform="rotate(8 78 78)" filter="url(#lift)"><rect x="58" y="58" width="40" height="40" rx="10" fill="#9B7BF5"/></g>
  <g transform="rotate(8 78 78)"><text x="78" y="78" font-family="'Bricolage Grotesque', sans-serif" font-weight="800" font-size="25" fill="#121115" text-anchor="middle" dominant-baseline="central">o</text></g>
</svg>
